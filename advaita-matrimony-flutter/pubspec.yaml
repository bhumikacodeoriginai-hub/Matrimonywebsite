name: advaita_matrimony
description: Advaita Matrimony - India's Most Inclusive Matrimonial App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Authentication & Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.8
  lottie: ^3.0.0
  
  # Image & Camera
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  
  # Payment
  razorpay_flutter: ^1.3.6
  
  # Firebase is not initialized or used in the current app shell.
  
  # Chat & Communication
  web_socket_channel: ^2.4.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  permission_handler: ^11.2.0
  flutter_local_notifications: ^16.3.2
  pin_code_fields: ^8.0.1
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  
  # Screenshot prevention is not currently active; no package is required here.
  local_auth: ^2.1.8  # Biometric auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
flutter:
  uses-material-design: true
